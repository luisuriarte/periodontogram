<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="0 0 72 96">
  <!-- Vertical tooth template. CEJ at y=48. Sites at x=20,36,52. -->
  <rect x="6" y="6" width="60" height="84" fill="none" stroke="#adb5bd" stroke-width="1"/>
  <!-- CEJ line -->
  <line x1="6" y1="48" x2="66" y2="48" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Site guides -->
  <line x1="20" y1="18" x2="20" y2="78" stroke="#dee2e6" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="36" y1="18" x2="36" y2="78" stroke="#dee2e6" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="52" y1="18" x2="52" y2="78" stroke="#dee2e6" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- FDI number (filled by JS, do not bake into art) -->
  <text x="36" y="52" font-size="7" text-anchor="middle" fill="#adb5bd">11</text>
  <!-- Example tooth silhouette: vertical, crown up, root down -->
  <g id="tooth-shape">
    <!-- Crown -->
    <path d="M 18 10 H 54 Q 58 10 57 16 L 55 42 Q 54 47 50 50 L 45 78 Q 43 86 39 86 Q 35 86 33 78 L 28 50 Q 24 47 23 42 L 21 16 Q 20 10 18 10 Z" fill="#ffffff" fill-opacity="0.85" stroke="#868e96" stroke-width="1.2"/>
    <!-- Pulp hint (optional, deletable) -->
    <path d="M 33 20 L 33 70 M 39 20 L 39 70" stroke="#dee2e6" stroke-width="1" fill="none"/>
  </g>
</svg>
