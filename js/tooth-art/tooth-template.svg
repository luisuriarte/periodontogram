<svg xmlns="http://www.w3.org/2000/svg" width="96" height="52" viewBox="0 0 96 52">
  <!-- Tooth template guide 96x52. CEJ at y=26. Sites at x=28,48,68. -->
  <rect x="14" y="4" width="68" height="44" fill="none" stroke="#adb5bd" stroke-width="1"/>
  <!-- CEJ line -->
  <line x1="14" y1="26" x2="82" y2="26" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Site guides (vertical dotted) -->
  <line x1="28" y1="12" x2="28" y2="40" stroke="#dee2e6" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="48" y1="12" x2="48" y2="40" stroke="#dee2e6" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="68" y1="12" x2="68" y2="40" stroke="#dee2e6" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- FDI number position (filled by JS, do not bake into art) -->
  <text x="48" y="30" font-size="7" text-anchor="middle" fill="#adb5bd">11</text>
  <!-- Example tooth silhouette (upper incisor, deletable) -->
  <g id="tooth-shape">
    <path d="M 30 8 H 66 Q 70 8 69 14 L 67 24 Q 66 28 63 34 L 58 44 Q 56 48 52 48 Q 48 48 46 44 L 41 34 Q 38 28 37 24 L 35 14 Q 34 8 30 8 Z" fill="#ffffff" fill-opacity="0.85" stroke="#868e96" stroke-width="1.2"/>
  </g>
</svg>
