<svg xmlns="http://www.w3.org/2000/svg" width="72" height="96" viewBox="0 0 72 96">
  <!-- Implant template 72x96 vertical. Crown above CEJ (y=48), screw below. -->
  <rect x="6" y="6" width="60" height="84" fill="none" stroke="#adb5bd" stroke-width="1"/>
  <line x1="6" y1="48" x2="66" y2="48" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="20" y1="18" x2="20" y2="78" stroke="#dee2e6" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="36" y1="18" x2="36" y2="78" stroke="#dee2e6" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="52" y1="18" x2="52" y2="78" stroke="#dee2e6" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- Implant: crown + abutment + screw body -->
  <g id="implant-shape">
    <!-- Crown -->
    <path d="M 22 10 H 50 Q 54 10 53 16 L 51 42 Q 50 47 46 48 H 26 Q 22 47 21 42 L 19 16 Q 18 10 22 10 Z" fill="#ffffff" fill-opacity="0.9" stroke="#17a2b8" stroke-width="1.4"/>
    <!-- Abutment -->
    <rect x="30" y="48" width="12" height="6" fill="#e7f5ff" stroke="#17a2b8" stroke-width="1.2"/>
    <!-- Screw body (tapered) -->
    <path d="M 30 54 L 42 54 L 40 78 Q 39 84 36 84 Q 33 84 32 78 Z" fill="#e7f5ff" stroke="#17a2b8" stroke-width="1.2"/>
    <!-- Threads -->
    <line x1="31" y1="60" x2="41" y2="60" stroke="#17a2b8" stroke-width="1"/>
    <line x1="32" y1="66" x2="40" y2="66" stroke="#17a2b8" stroke-width="1"/>
    <line x1="32" y1="72" x2="40" y2="72" stroke="#17a2b8" stroke-width="1"/>
  </g>
</svg>
